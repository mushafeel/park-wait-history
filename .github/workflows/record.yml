name: Record wait times

on:
  schedule:
    # Every 5 minutes, 08:00–22:59 Japan time (= 23:00–13:59 UTC).
    - cron: "*/5 23,0-13 * * *"
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: record
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Record live waits
        run: python3 recorder/record.py
      - name: Save to repository
        run: |
          git config user.name "wait-recorder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data || true
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Wait times $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M') JST"
          git pull --rebase --quiet || true
          git push
